spring:
  application:
    name: market-message-processor

  # Default: H2 file-based database (works out of the box)
  datasource:
    url: jdbc:h2:file:./data/market_messages;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: false    # Beveiligingsmaatregel: H2 console standaard uit

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.H2Dialect

  jackson:
    serialization:
      write-dates-as-timestamps: false

  # Beveiliging: beperk request grootte
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

server:
  port: 8080
  # Beveiliging: beperk request grootte op Tomcat niveau
  tomcat:
    max-http-form-post-size: 2MB
    max-swallow-size: 2MB
  # Beveiliging: verberg server info
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false
    include-binding-errors: never

# Application-specific configuration
pipeline:
  forward-nack-internally: false
  async-enabled: true

logging:
  level:
    nl.engie.allocation: INFO
    org.hibernate.SQL: WARN
    org.springframework.security: WARN

---
# PostgreSQL profile - activate with: --spring.profiles.active=postgres
# Start PostgreSQL first: docker compose up -d
spring:
  config:
    activate:
      on-profile: postgres

  datasource:
    url: jdbc:postgresql://localhost:5433/market_messages
    username: engie
    password: engie123
    driver-class-name: org.postgresql.Driver

  h2:
    console:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: update    # Eerste keer 'update' voor schema aanmaak, daarna wijzigen naar 'validate'
    database-platform: org.hibernate.dialect.PostgreSQLDialect
