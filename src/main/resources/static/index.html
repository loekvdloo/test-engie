<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENGIE Market Messages Dashboard</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/stats.css">
    <link rel="stylesheet" href="css/filters.css">
    <link rel="stylesheet" href="css/messages.css">
    <link rel="stylesheet" href="css/detail-panel.css">
    <link rel="stylesheet" href="css/pipeline.css">
    <link rel="stylesheet" href="css/errors.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>

<!-- ==================== HEADER ==================== -->
<header>
    <h1><span class="accent">⚡</span> ENGIE Market Messages</h1>
    <div class="header-actions">
        <button class="btn btn-blue" id="seedBtn">🧪 Laad Test Data</button>
        <button class="btn" id="refreshBtn">🔄 Vernieuwen</button>
    </div>
</header>

<!-- ==================== MAIN CONTENT ==================== -->
<div class="container">

    <!-- Stats cards -->
    <div class="stats-bar">
        <div class="stat-card">
            <span class="label">Totaal</span>
            <span class="value blue" id="statTotal">0</span>
        </div>
        <div class="stat-card">
            <span class="label">Geslaagd (ACK)</span>
            <span class="value green" id="statSuccess">0</span>
        </div>
        <div class="stat-card">
            <span class="label">Gefaald (NACK)</span>
            <span class="value red" id="statFailed">0</span>
        </div>
        <div class="stat-card">
            <span class="label">Laatste bericht</span>
            <span class="value muted" id="statLastTime">-</span>
        </div>
    </div>

    <!-- Filter & sort bar -->
    <div class="filter-bar">
        <span class="label">Filter:</span>
        <button class="btn filter-btn active" data-filter="all">Alle berichten</button>
        <button class="btn filter-btn btn-green" data-filter="success">✓ Geslaagd</button>
        <button class="btn filter-btn btn-red" data-filter="failed">✗ Gefaald</button>

        <span class="label spacer">Sorteer:</span>
        <button class="btn filter-btn active" data-sort="newest">Nieuwste eerst</button>
        <button class="btn filter-btn" data-sort="oldest">Oudste eerst</button>
    </div>

    <!-- Message list -->
    <div class="message-list" id="messageList">
        <div class="loading"><div class="spinner"></div>Berichten laden...</div>
    </div>
</div>

<!-- ==================== DETAIL SLIDE-IN PANEL ==================== -->
<div class="overlay" id="overlay"></div>

<div class="detail-panel" id="detailPanel">
    <div class="detail-header">
        <div>
            <h2 id="detailTitle">Bericht Details</h2>
            <div class="uuid-label" id="detailUuid"></div>
        </div>
        <button class="close-btn" id="closeDetailBtn">×</button>
    </div>
    <div class="detail-body" id="detailBody"></div>
</div>

<!-- ==================== TOAST ==================== -->
<div class="toast" id="toast"></div>

<!-- ==================== JAVASCRIPT ==================== -->
<script src="js/api.js"></script>
<script src="js/utils.js"></script>
<script src="js/render.js"></script>
<script src="js/app.js"></script>

</body>
</html>
