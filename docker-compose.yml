services:
  postgres:
    image: postgres:16
    container_name: engie-postgres
    environment:
      POSTGRES_DB: market_messages
      POSTGRES_USER: engie
      POSTGRES_PASSWORD: engie123
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U engie -d market_messages"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
