spring:
  application:
    name: market-message-processor

  # Default: H2 file-based database (works out of the box)
  datasource:
    url: jdbc:h2:file:./data/market_messages;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.H2Dialect

  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

# Application-specific configuration
pipeline:
  forward-nack-internally: false
  async-enabled: true

logging:
  level:
    nl.engie.allocation: DEBUG
    org.hibernate.SQL: WARN

---
# MySQL profile - activate with: --spring.profiles.active=mysql
# Start MySQL first: docker compose up -d
spring:
  config:
    activate:
      on-profile: mysql

  datasource:
    url: jdbc:mysql://localhost:3306/market_messages?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: engie
    password: engie123
    driver-class-name: com.mysql.cj.jdbc.Driver

  h2:
    console:
      enabled: false

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
